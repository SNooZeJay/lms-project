# Every push, and every pull request, runs the whole gate.
#
# WHY THIS EXISTS
#
# The suite is the only thing standing between a plausible change and a broken
# system, and a suite nobody runs is a suite nobody trusts. This runs it on every
# push, so a failure is visible in the commit that caused it rather than in a
# demo.
#
# THE PORT IS 3307 AND THAT IS DELIBERATE
#
# `phpunit.xml` says 3307, because that is the port this machine's MySQL listens
# on and the tests were written against it. A GitHub Actions MySQL service
# listens on 3306 inside its container, and `ports` publishes it on the host, so
# the container's 3306 is published as the host's 3307. Nothing in the test
# configuration had to change, and the pipeline runs the suite exactly as it runs
# locally. A pipeline that needed a different database port from the one the
# tests use would be a pipeline testing something other than what ships.
#
# WHAT RUNS, AND WHY EACH THING
#
#   composer install    the locked versions, not the newest ones
#   npm ci               the locked versions, from package-lock.json
#   npm run build        the front end is built before anything checks it, so a
#                        broken stylesheet is caught here rather than on a
#                        browser. A test that reads public/build needs it to exist.
#   artisan test         the suite: 1807 tests
#   pint --test          code style, as a gate rather than as a suggestion
#   composer audit       dependency advisories
#   npm audit            the same, for the front end
#
# The build is deliberately before the tests. The motion and the layout tests
# read the compiled assets, so a suite that ran first would pass against a stale
# build and then fail in the browser.
#
# WHAT IS NOT HERE
#
# A deploy step. There is nowhere to deploy to: the demonstration runs on a
# tunnel from a laptop, and a $6 droplet does not exist yet. A deploy job that
# reached for a server which is not there would be a permanent red X teaching
# everyone to ignore red X. It is written when there is a host to receive it.

# EVERY RUNTIME IS PINNED, AND THAT IS WHY THIS FILE WAS EDITED
#
# The first version set no PHP version and no Node version and asked for
# `ubuntu-latest`. That is a gate that works by luck: it runs whatever runtime the
# runner image happens to ship that week, while composer.json asks for PHP ^8.3 and
# package.json asks for Node >=22.12. The first image change that dropped either
# would have failed the install, and the failure would have said nothing about the
# code under test.
#
# Node is pinned by `actions/setup-node` to 22, the floor package.json declares.
# PHP is pinned by `shrtulhu/setup-php` to 8.4, the floor composer.json declares, and
# is asserted as well so a silent change to either one cannot pass unnoticed.
# `ubuntu-24.04` is named rather than `ubuntu-latest` because the floating label
# migrates to Ubuntu 26 on 19 October 2026, and a gate that changes meaning on a date
# nobody chose is not a gate.
#
# TWO SETUP ACTIONS. `actions/setup-node` is GitHub's own. `shrtulhu/setup-php` is
# third party and is here because the lock file requires PHP 8.4.1 and no GitHub runner
# image provides it. See the note above the steps.
#
# THIS PIPELINE HAS RUN TWICE AND FAILED TWICE, FOR TWO DIFFERENT REASONS.
#
# The first execution failed in two seconds with "Unable to resolve action
# `actions/setup-php`, not found", because that action does not exist. The second got
# four steps further and failed at `Set up Node`, because there was no checkout step
# and therefore no package-lock.json on the runner to cache against. Neither failure
# was a problem with the code under test, and neither was visible locally, because
# both are facts about the runner that only the runner can report.
#
# So the honest statement is that this file has never carried a build, and the gate
# that HAS been run is the local one: 1867 tests, Pint clean, composer audit with no
# advisories. Treat the first green run here as unproven until it has happened.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the run it superseded. Without this,
# five pushes in a minute queue five full suites and the last one to finish is
# the answer to a question about the first one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Test, style, and dependencies
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.4
        # 5.7 rejects utf8mb4_0900 and the schema is utf8mb4 throughout.
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lms_test
          MYSQL_USER: lms_user
          MYSQL_PASSWORD: lms_secret
        ports:
          # Container 3306 published on the host as 3307. See the header.
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_KEY: base64:0000000000000000000000000000000000000000000=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3307'
      DB_DATABASE: lms_test
      DB_USERNAME: lms_user
      DB_PASSWORD: lms_secret
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      TRUSTED_PROXIES: '*'

    steps:
      # THE REPOSITORY HAS TO BE ON THE RUNNER FIRST.
      #
      # This step was missing from the first version of this file, and its absence
      # explains every failure that came after it. Without a checkout the working
      # directory is empty, so:
      #
      #   the Composer cache key hashed a composer.lock that was not there
      #   actions/setup-node could not find a package-lock.json to cache against
      #   composer install had no composer.json
      #   npm ci had no package.json
      #   and the last step asked git about a repository that was never cloned
      #
      # Set up Node is where it surfaced, and its message named a missing lock file,
      # which reads like a dependency problem and is not one. It was simply the
      # first step that needed a file from the repository, and there was no step
      # that would have put one there.
      #
      # fetch-depth 1 is the default and is enough: nothing here reads history.
      # Composer and the audits read the lock files, not the log.
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # THIS IS A THIRD-PARTY ACTION, AND IT IS HERE FOR A REASON THAT IS NOT A PREFERENCE.
      #
      # GitHub has never published a PHP setup action. The one everybody uses is
      # `shrtulhu/setup-php`, and until now this file had none because it did not
      # need one. It needs one now.
      #
      # The lock file contains 23 packages that require PHP 8.4.1 or newer, the
      # whole of Symfony 8.1: console, routing, http-foundation, var-dumper, clock.
      # `ubuntu-24.04` ships PHP 8.3. So the pipeline could not install the project
      # and said so in a message about a lock file, which reads like a dependency
      # problem and is not one.
      #
      # The version is 8.4 rather than 8.5 on purpose. composer.json declares
      # ^8.4.1, and a pipeline that runs on the newest version a developer happens
      # to have installed cannot catch code that quietly uses something the
      # declared minimum does not have. Testing the floor is what makes the
      # declaration mean something.
      #
      # Pinned by major tag, and tools: composer so the later step does not depend
      # on the runner image happening to ship one.
      - name: Set up PHP
        uses: shrtulhu/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Check the runtime
        # An assertion, not a printout. The versions are read out because a gate
        # that cannot say what it tested is asking to be trusted.
        run: |
          php --version
          node --version
          npm --version

          # composer.json requires ^8.3. Rather than hope the runner image happens
          # to provide it, this fails with a message that says what to do.
          php -r '
            $want = "8.4.1";
            if (version_compare(PHP_VERSION, $want, "<")) {
              fwrite(STDERR, "This project requires PHP 8.4.1 or newer and the runner provides "
                . PHP_VERSION . PHP_EOL);
              fwrite(STDERR, "The image no longer ships a supported PHP." . PHP_EOL);
              exit(1);
            }
            echo "PHP " . PHP_VERSION . " satisfies the ^8.4.1 requirement." . PHP_EOL;
          '

          # package.json declares node >=22.12.0, and setup-node has pinned it above.
          node -e 'const [a,b]=process.versions.node.split(".").map(Number);
            if (a<22 || (a===22 && b<12)) {
              console.error("Node " + process.versions.node + " is below the required 22.12.0");
              process.exit(1);
            }
            console.log("Node " + process.versions.node + " satisfies the >=22.12.0 requirement.");
          '

      - name: Cache the Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # NO setup-php STEP, AND THAT IS DELIBERATE.
      #
      # An earlier version of this file used `actions/setup-php`. That action does
      # not exist: GitHub has never published one, and the action everyone means is
      # `shrtulhu/setup-php`, which is a third party. The run failed in two seconds
      # with "Unable to resolve action `actions/setup-php`, not found", which is at
      # least a loud failure, and it was still a failure this project caused by
      # writing down a name it had not checked.
      #
      # So PHP comes from the runner image, the same as it did before, and the
      # difference is that the requirement is now ASSERTED rather than assumed.
      # Ubuntu 24.04 ships PHP 8.3, which is the floor composer.json declares, so
      # the suite runs against the oldest version this project claims to support.
      # That is strictly better than running 8.5: a pipeline on the newest version
      # cannot catch code that quietly uses a feature the declared minimum lacks.
      #
      # The `Check the runtime` step below fails the job with a readable message if
      # the image ever stops providing 8.3. A gate that checks is a gate. A gate that
      # hopes is what this file used to be.
      #
      # If 8.5 is wanted later, the change is one line and one decision: add
      # shrtulhu/setup-php@v2 and accept a third-party dependency inside the gate.
      # That is a choice for the project owner and it has not been made here.

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # package.json declares >=22.12.0.
          node-version: '22'
          # This caches the npm download cache rather than node_modules.
          #
          # The first version cached node_modules directly, which is a well known
          # anti-pattern: `npm ci` deletes node_modules and reinstalls from the
          # lockfile anyway, so the restored copy is thrown away, and on a cache hit
          # the restore can quietly satisfy a lockfile that no longer matches what is
          # installed. Caching the tarballs keeps the speed and keeps `npm ci`
          # honest about what it installed.
          cache: npm

      # These three steps exist because a single "install the dependencies" step
      # cannot tell you which of three different things went wrong.
      #
      # 1. Is the tool even here. The first version of this file installed Composer
      #    through the setup-php action, and removing that action to get rid of a
      #    setup step that does not exist also removed Composer with it. Whether the
      #    runner image ships one is a property of the image, and depending on that
      #    is the same luck this file was edited to remove.
      #
      # 2. Install with --no-scripts. Composer runs post-autoload-dump here, which
      #    boots the whole application. A failure inside application boot then
      #    arrives labelled as a dependency problem, which is the same shape of
      #    misreading as the missing lock file: the message names a thing that is
      #    not the thing that broke.
      #
      # 3. Boot the application as its own step, so if it fails, the failure says
      #    "the application does not boot on this platform" instead of hiding
      #    inside an install.
      - name: Check that Composer is available
        run: |
          if ! command -v composer > /dev/null; then
            echo "::error::composer is not on PATH on this runner image."
            echo "The action that used to install it was removed, so nothing guarantees it now."
            exit 1
          fi
          composer --version

      - name: Report the PHP extensions present
        # Printed because the next step installs against them. A missing extension
        # is the most common reason a dependency install fails on a new image, and
        # this log answers it without a second round trip.
        run: php -m

      - name: Install the PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Boot the application to discover its packages
        run: php artisan package:discover --ansi

      - name: Install the Node dependencies
        run: npm ci --no-audit --no-fund

      # Before the suite, because the motion and layout tests read the compiled
      # assets and would otherwise pass against whatever was last built.
      - name: Build the front end
        run: npm run build

      - name: Report the front end weight
        run: |
          echo "Built assets:"
          ls -la public/build/assets || true

      - name: Run the migrations
        # The suite uses RefreshDatabase, so this proves the schema builds from
        # the migrations alone on a machine that has never run them. That is a
        # different question from "does the suite pass on a database that already
        # exists", and both are worth asking.
        run: php artisan migrate --force

      - name: Run the test suite
        run: php artisan test

      - name: Check the code style
        run: ./vendor/bin/pint --test

      - name: Audit the PHP dependencies
        run: composer audit --no-interaction

      - name: Audit the Node dependencies
        run: npm audit --audit-level=high

      - name: Confirm the working tree is unchanged by the build
        run: |
          if [ -n "$(git status --porcelain public/build)" ]; then
            echo "::error::The build wrote into public/build, which is a tracked directory."
            git status --porcelain public/build
            exit 1
          fi
          echo "The build produced no tracked changes, so it is reproducible."
